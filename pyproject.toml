[project]
name = "realtime-interpreter"
version = "0.1.0"
description = "Low-latency EN→JA simultaneous interpreter using direct audio→LLM (mlx-vlm + Gemma-3n)"
readme = "README.md"
authors = [
    { name = "Jun-ya Kato", email = "kato@win6.jp" }
]
requires-python = ">=3.11,<3.14"
# クロスプラットフォーム共通の依存 (OpenAI バックエンドはこれだけで動く).
# mlx バックエンド関連は Apple Silicon 専用なので platform marker で macOS のみに限定し、
# Windows/Linux では `uv sync` 時に自動でスキップされる (= OpenAI バックエンド専用構成)。
dependencies = [
    "sounddevice>=0.5",
    "numpy>=1.26",
    "rich>=13.7",
    "websocket-client>=1.8",
    "openai>=1.40",
    # --- mlx backend only (macOS / Apple Silicon) ---
    "mlx-vlm>=0.1.20; sys_platform == 'darwin'",
    "silero-vad-lite>=0.1; sys_platform == 'darwin'",
    "librosa>=0.10; sys_platform == 'darwin'",
    "soundfile>=0.12; sys_platform == 'darwin'",
]

[project.scripts]
realtime-interpreter = "realtime_interpreter.main:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
]

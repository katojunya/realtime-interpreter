[project]
name = "realtime-interpreter"
version = "0.1.0"
description = "Low-latency EN→JA simultaneous interpreter using direct audio→LLM (mlx-vlm + Gemma-3n)"
readme = "README.md"
authors = [
    { name = "Jun-ya Kato", email = "kato@win6.jp" }
]
requires-python = ">=3.11,<3.14"
# クロスプラットフォーム共通の依存.
# mlx-vlm は Apple Silicon 専用なので macOS のみに限定する。
# silero-vad-lite はローカル VAD バックエンド (mlx / openai-chat) で使うため、
# macOS と Windows に入れる。Windows では openai-chat が WASAPI loopback + VAD で使う。
dependencies = [
    "sounddevice>=0.5",
    "numpy>=1.26",
    "rich>=13.7",
    "websocket-client>=1.8",
    "openai>=1.40",
    # OS 証明書ストア検証 (--system-certs). 企業 TLS インターセプト環境で、ランタイムの
    # HTTPS/WSS を OS ストア (Windows 証明書ストア / macOS キーチェーン / Linux システムCA)
    # で検証するために使う。ctypes ベースで追加ビルド不要 (全OS)。
    "truststore>=0.10",
    # --- Windows only: WASAPI loopback capture (sounddevice has no loopback support) ---
    "pyaudiowpatch>=0.2.12; sys_platform == 'win32'",
    # --- local VAD backends (mlx / openai-chat) ---
    # openai-chat は Intel macOS でも使うため arm64 限定にしない (darwin 全体 + win32)。
    "silero-vad-lite>=0.2.1; sys_platform == 'darwin' or sys_platform == 'win32'",
    # --- mlx backend only (Apple Silicon macOS) ---
    # mlx は Apple Silicon 専用。Intel Mac には wheel が無く uv sync が失敗するため、
    # platform_machine == 'arm64' で限定する (mlx-vlm の間接依存 librosa/soundfile も同様)。
    "mlx-vlm>=0.1.20; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "librosa>=0.10; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "soundfile>=0.12; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[project.optional-dependencies]
# 話者ダイアライゼーション (--diarize, 実験的 DIALIZATION-1). 既定では入れない。
# `uv sync --extra diarize` で導入。resemblyzer は話者埋め込み用 (torch を間接的に伴う)。
diarize = [
    "resemblyzer>=0.1",
]

[project.scripts]
realtime-interpreter = "realtime_interpreter.main:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
]

[project]
name = "realtime-interpreter"
version = "0.1.0"
description = "Low-latency EN→JA simultaneous interpreter using direct audio→LLM (mlx-vlm + Gemma-3n)"
readme = "README.md"
authors = [
    { name = "Jun-ya Kato", email = "kato@win6.jp" }
]
requires-python = ">=3.11,<3.14"
dependencies = [
    "mlx-vlm>=0.1.20",
    "sounddevice>=0.5",
    "silero-vad-lite>=0.1",
    "numpy>=1.26",
    "librosa>=0.10",
    "soundfile>=0.12",
]

[project.scripts]
realtime-interpreter = "realtime_interpreter.main:main"

[build-system]
requires = ["uv_build>=0.11.11,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8",
]
